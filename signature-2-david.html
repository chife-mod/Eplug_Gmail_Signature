  1. Gmail MOBILE APP vertical "stretch". The app slaps a default ~14px margin
     onto any block element (<p>/<div>) it finds inside a <td>. Fix, per
     xink.io and gimm.io: every text cell carries an explicit inline line-height
     AND its content is wrapped in <p style="margin:0;...">, so there is no
     default margin left to inflate. (Spacer cells also carry line-height:1px.)

     so they cannot be made transparent — they would float as white patches on a
     dark background. So the whole signature is pinned to a solid white block via
     bgcolor ATTRIBUTES (Gmail dark mode honours the attribute, not CSS
     background-color) plus color-scheme:light only. Black text stays black on
     white, images blend in.

  Both columns balance at 238px.
