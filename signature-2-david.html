<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Energy Plus Signature — David Orgel</title>
</head>

<body style="margin:0;padding:40px;background:#f5f5f5;">

    <!--
  Gmail Email Signature — David Orgel, Energy Plus
  Layout: Type 2 (Extended — Energy Plus) family, per client request:
  the Energy Plus logo + Recognition & Awards, NO VUE promo, NO LinkedIn.
  No job title was supplied, so the title row is omitted.

  INSTALL: Open in Chrome -> Cmd+A -> Cmd+C -> Gmail Settings -> Signature -> Cmd+V -> Save

  Column arithmetic: 24 + 201 + 24 + 327 + 24 = 600.
  Both columns balance at 238px (no title / no LinkedIn shortens the left, so
  the logo→R&A gap is 48 not 49 and the right top spacer is 24 not 73):
    LEFT  = 24 + 24(name) + 8 + 14(brand) + 16 + 128(contacts) + 24 = 238
    RIGHT = 24 + 47(logo) + 48 + 14(R&A) + 14 + 67(awards) + 24     = 238
  Contacts 128 = email 18 / 8 / phones 34 / 8 / address 34 / 8 / website 18.

  Assets are the shared @3x sig-ep/ set (awards, chips, logo, R&A header).
-->

    <!-- EMAIL SIGNATURE START -->
    <!-- Forced white block: bgcolor ATTRIBUTES (not just CSS) so Gmail/Apple dark
         mode keeps the signature on white and does not invert the black text or
         darken behind the white-background images (logo, R&A header, award tiles).
         color-scheme:light only reinforces the intent where it is honoured. -->
    <table width="600" cellpadding="0" cellspacing="0" border="0" role="presentation" bgcolor="#FFFFFF"
        style="border-collapse:collapse;width:600px;background-color:#FFFFFF;color-scheme:light only;font-family:Arial,sans-serif;-webkit-text-size-adjust:none;mso-table-lspace:0;mso-table-rspace:0;">
        <tr>
            <td bgcolor="#FFFFFF" style="background-color:#FFFFFF;padding:0;">
                <table width="600" cellpadding="0" cellspacing="0" border="0" role="presentation" bgcolor="#FFFFFF"
                    style="border-collapse:collapse;width:600px;background-color:#FFFFFF;">
                    <tr>
                        <td width="24" style="width:24px;font-size:1px;line-height:1px;">&nbsp;</td>

                        <!-- ── LEFT column: name + contacts (201px content) ── -->
                        <td width="201" valign="top" bgcolor="#FFFFFF" style="width:201px;vertical-align:top;background-color:#FFFFFF;">
                            <table cellpadding="0" cellspacing="0" border="0" role="presentation"
                                style="border-collapse:collapse;">
                                <tr>
                                    <td height="24" style="height:24px;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                                </tr>
                                <tr>
                                    <td style="font-family:Arial,sans-serif;font-size:24px;font-weight:bold;color:#000000;line-height:24px;mso-line-height-rule:exactly;white-space:nowrap;">
                                        David Orgel
                                    </td>
                                </tr>
                                <tr>
                                    <td height="8" style="height:8px;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                                </tr>
                                <tr>
                                    <td style="font-family:Arial,sans-serif;font-size:14px;font-weight:bold;color:#327A39;line-height:14px;mso-line-height-rule:exactly;white-space:nowrap;">
                                        Energy Plus
                                    </td>
                                </tr>
                                <tr>
                                    <td height="16" style="height:16px;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                                </tr>

                                <!-- contact rows: 18 / 8 / 34 / 8 / 34 / 8 / 18 = 128px -->
                                <tr>
                                    <td style="padding:0;">
                                        <table cellpadding="0" cellspacing="0" border="0" role="presentation"
                                            style="border-collapse:collapse;">

                                            <!-- Email -->
                                            <tr>
                                                <td width="18" height="18" valign="middle" style="width:18px;height:18px;vertical-align:middle;">
                                                    <img src="https://chife-mod.github.io/Eplug_Gmail_Signature/public/assets/images/sig-ep/chip-mail.png"
                                                        alt="" width="18" height="18" border="0"
                                                        style="display:block;border:0;outline:none;" />
                                                </td>
                                                <td width="8" style="width:8px;font-size:1px;line-height:1px;">&nbsp;</td>
                                                <td valign="middle"
                                                    style="font-family:Arial,sans-serif;font-size:14px;color:#000000;line-height:17px;mso-line-height-rule:exactly;vertical-align:middle;white-space:nowrap;">
                                                    <a href="mailto:david@energyplusny.com"
                                                        style="color:#000000;text-decoration:none;">david@energyplusny.com</a>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td colspan="3" height="8" style="height:8px;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                                            </tr>

                                            <!-- Phones (office + mobile, two lines) -->
                                            <tr>
                                                <td width="18" valign="top" style="width:18px;vertical-align:top;">
                                                    <img src="https://chife-mod.github.io/Eplug_Gmail_Signature/public/assets/images/sig-ep/chip-phone.png"
                                                        alt="" width="18" height="18" border="0"
                                                        style="display:block;border:0;outline:none;" />
                                                </td>
                                                <td width="8" style="width:8px;font-size:1px;line-height:1px;">&nbsp;</td>
                                                <td valign="top"
                                                    style="font-family:Arial,sans-serif;font-size:14px;color:#000000;line-height:17px;mso-line-height-rule:exactly;vertical-align:top;white-space:nowrap;">
                                                    <a href="tel:+17183839255"
                                                        style="color:#000000;text-decoration:none;">718-383-9255 x241</a><br />
                                                    <a href="tel:+19178808862"
                                                        style="color:#000000;text-decoration:none;">(917) 880-8862</a>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td colspan="3" height="8" style="height:8px;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                                            </tr>

                                            <!-- Address (two lines) -->
                                            <tr>
                                                <td width="18" valign="top" style="width:18px;vertical-align:top;">
                                                    <img src="https://chife-mod.github.io/Eplug_Gmail_Signature/public/assets/images/sig-ep/chip-pin.png"
                                                        alt="" width="18" height="18" border="0"
                                                        style="display:block;border:0;outline:none;" />
                                                </td>
                                                <td width="8" style="width:8px;font-size:1px;line-height:1px;">&nbsp;</td>
                                                <td valign="top"
                                                    style="font-family:Arial,sans-serif;font-size:14px;color:#000000;line-height:17px;mso-line-height-rule:exactly;vertical-align:top;white-space:nowrap;">
                                                    670 Flushing Ave.<br />Brooklyn, NY 11206
                                                </td>
                                            </tr>
                                            <tr>
                                                <td colspan="3" height="8" style="height:8px;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                                            </tr>

                                            <!-- Website -->
                                            <tr>
                                                <td width="18" height="18" valign="middle" style="width:18px;height:18px;vertical-align:middle;">
                                                    <img src="https://chife-mod.github.io/Eplug_Gmail_Signature/public/assets/images/sig-ep/chip-globe.png"
                                                        alt="" width="18" height="18" border="0"
                                                        style="display:block;border:0;outline:none;" />
                                                </td>
                                                <td width="8" style="width:8px;font-size:1px;line-height:1px;">&nbsp;</td>
                                                <td valign="middle"
                                                    style="font-family:Arial,sans-serif;font-size:14px;color:#000000;line-height:17px;mso-line-height-rule:exactly;vertical-align:middle;white-space:nowrap;">
                                                    <a href="https://energyplusny.com"
                                                        style="color:#000000;text-decoration:none;">energyplusny.com</a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td height="24" style="height:24px;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>

                        <td width="24" style="width:24px;font-size:1px;line-height:1px;">&nbsp;</td>

                        <!-- ── RIGHT column: Energy Plus logo + awards (327px content) ── -->
                        <td width="327" valign="top" bgcolor="#FFFFFF" style="width:327px;vertical-align:top;background-color:#FFFFFF;">
                            <table width="327" cellpadding="0" cellspacing="0" border="0" role="presentation"
                                style="border-collapse:collapse;width:327px;">
                                <tr>
                                    <td height="24" style="height:24px;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                                </tr>
                                <tr>
                                    <td align="center" style="text-align:center;">
                                        <a href="https://energyplusny.com"
                                            style="text-decoration:none;border:0;color:#327A39;font-family:Arial,sans-serif;font-size:14px;">
                                            <img src="https://chife-mod.github.io/Eplug_Gmail_Signature/public/assets/images/sig-ep/ep-logo.png"
                                                alt="Energy Plus" width="130" height="47" border="0"
                                                style="display:block;border:0;outline:none;margin:0 auto;" />
                                        </a>
                                    </td>
                                </tr>
                                <tr>
                                    <td height="48" style="height:48px;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                                </tr>

                                <!-- rule / "Recognition & Awards" / rule — one image slice -->
                                <tr>
                                    <td style="font-family:Arial,sans-serif;font-size:12px;color:#000000;">
                                        <img src="https://chife-mod.github.io/Eplug_Gmail_Signature/public/assets/images/sig-ep/ra-header.png"
                                            alt="Recognition &amp; Awards" width="327" height="14" border="0"
                                            style="display:block;border:0;outline:none;" />
                                    </td>
                                </tr>
                                <tr>
                                    <td height="14" style="height:14px;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                                </tr>

                                <!-- award badges: 67 / 7 / 67 / 6 / 87 / 6 / 87 = 327px -->
                                <tr>
                                    <td style="padding:0;">
                                        <table width="327" cellpadding="0" cellspacing="0" border="0" role="presentation"
                                            style="border-collapse:collapse;width:327px;">
                                            <tr>
                                                <td width="67" style="width:67px;">
                                                    <img src="https://chife-mod.github.io/Eplug_Gmail_Signature/public/assets/images/sig-ep/award-1.jpg"
                                                        alt="conEdison 2023 E-Mobility Award — Impact Award" width="67" height="67" border="0"
                                                        style="display:block;border:0;outline:none;" />
                                                </td>
                                                <td width="7" style="width:7px;font-size:1px;line-height:1px;">&nbsp;</td>
                                                <td width="67" style="width:67px;">
                                                    <img src="https://chife-mod.github.io/Eplug_Gmail_Signature/public/assets/images/sig-ep/award-2.jpg"
                                                        alt="conEdison 2023 PowerReady Installer Award — L2 Blitz Winner" width="67" height="67" border="0"
                                                        style="display:block;border:0;outline:none;" />
                                                </td>
                                                <td width="6" style="width:6px;font-size:1px;line-height:1px;">&nbsp;</td>
                                                <td width="87" style="width:87px;">
                                                    <img src="https://chife-mod.github.io/Eplug_Gmail_Signature/public/assets/images/sig-ep/award-3.jpg"
                                                        alt="conEdison Certificate of Recognition — Multifamily Contractor of the Year 2024, Most Customers Served" width="87" height="67" border="0"
                                                        style="display:block;border:0;outline:none;" />
                                                </td>
                                                <td width="6" style="width:6px;font-size:1px;line-height:1px;">&nbsp;</td>
                                                <td width="87" style="width:87px;">
                                                    <img src="https://chife-mod.github.io/Eplug_Gmail_Signature/public/assets/images/sig-ep/award-4.jpg"
                                                        alt="conEdison Certificate of Recognition — Multifamily Contractor of the Year 2024, Diverse Measures" width="87" height="67" border="0"
                                                        style="display:block;border:0;outline:none;" />
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td height="24" style="height:24px;font-size:1px;line-height:1px;mso-line-height-rule:exactly;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>

                        <td width="24" style="width:24px;font-size:1px;line-height:1px;">&nbsp;</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    <!-- EMAIL SIGNATURE END -->

</body>
